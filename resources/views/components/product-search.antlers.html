<dialog id="product-search-dialog" class="product-search-dialog" aria-labelledby="product-search-title" data-catalog-url="/_search/catalog" data-html2canvas-ignore>
  <div class="product-search-heading">
    <div class="product-search-heading__inner">
      <h2 id="product-search-title">Search Le Cuvier</h2>
      <button type="button" class="product-search-close" data-product-search-close aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6" /></svg>
      </button>
      <form class="product-search-input" role="search" data-product-search-query>
        <label class="sr-only" for="product-search-query">Search the site</label>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>
        <input id="product-search-query" type="search" name="q" placeholder="Wines, experiences and more" autocomplete="off" enterkeyhint="search" autofocus>
        <button type="reset" class="product-search-clear" aria-label="Clear search" hidden>Clear</button>
      </form>
    </div>
  </div>
  <div class="product-search-body" data-product-search-body>
    <p data-product-search-loading role="status">Loading search…</p>
  </div>
</dialog>
