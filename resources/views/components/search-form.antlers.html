<form class="flex gap-6 items-center" action="{{ theme:search_results:url }}" method="get" role="search" data-product-search-form>
  <div class="relative flex-1">
    <input class="w-full px-12" placeholder="Wines, experiences and more" type="search" name="q" aria-label="Search the site" value="{{ get:q | entities }}">
    <button class="btn absolute inset-y-0 left-0 pl-4 pr-2" type="submit" aria-label="Search the site">
      {{ icon:lucide-search class="size-5" }}
    </button>
  </div>
</form>
